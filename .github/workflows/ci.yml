name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the ROS 2 / Gazebo image
        run: make deps BUILD_FLAGS=--network=host

      - name: Compile, lint and run the unit and launch tests
        run: make test

      - name: Run the missions in headless Gazebo
        run: experiments/run.sh square steps windup_none windup_back_calculation

      - name: Check the results against the regression thresholds
        run: make check

      - name: Keep the figures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            docs/results/
            experiments/bags/*.log
          retention-days: 14
