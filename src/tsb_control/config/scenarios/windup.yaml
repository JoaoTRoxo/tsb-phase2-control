# Asks for more speed than the robot has, for long enough to wind up an integrator,
# then for a speed it can reach. The recovery time shows what anti-windup is for.
reference_sequence:
  ros__parameters:
    steps: [2.0,  0.0,  0.0,
            12.0, 0.35, 0.0,
            10.0, 0.10, 0.0,
            2.0,  0.0,  0.0]
